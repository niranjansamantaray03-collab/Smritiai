<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SmritiAI</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:#f6f9fc;color:#172033}
button,input,select,textarea{font:inherit}
button{cursor:pointer;border:0}
.hidden{display:none!important}
.app{min-height:100vh}
.top{height:72px;background:#fff;border-bottom:1px solid #e6edf5;display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:20}
.logo{font-size:23px;font-weight:800;color:#2563eb}.logo span{color:#10b981}
.userbox{display:flex;align-items:center;gap:12px}
.avatar{width:40px;height:40px;border-radius:50%;background:#dbeafe;color:#2563eb;display:grid;place-items:center;font-weight:700}
.layout{display:flex;min-height:calc(100vh - 72px)}
.side{width:245px;background:#fff;border-right:1px solid #e6edf5;padding:20px 14px}
.nav{width:100%;text-align:left;padding:13px 15px;border-radius:12px;background:none;color:#566176;margin:4px 0;font-weight:600}
.nav:hover,.nav.active{background:#eff6ff;color:#2563eb}
.main{flex:1;padding:28px;max-width:1500px;margin:auto;width:100%}
.card{background:#fff;border:1px solid #e5ebf2;border-radius:18px;padding:22px;box-shadow:0 5px 20px rgba(25,50,80,.04)}
.grid{display:grid;gap:18px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
h1{font-size:30px;margin:0 0 8px}h2{font-size:21px;margin:0 0 12px}h3{margin:0 0 8px}
.muted{color:#697586}.small{font-size:13px}
.primary{background:#2563eb;color:#fff;padding:12px 18px;border-radius:11px;font-weight:700}
.success{background:#10b981;color:#fff;padding:12px 18px;border-radius:11px;font-weight:700}
.secondary{background:#eef4fb;color:#26364f;padding:12px 18px;border-radius:11px;font-weight:700}
.danger{background:#fee2e2;color:#b91c1c;padding:10px 14px;border-radius:10px}
.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.between{justify-content:space-between}
.stat{font-size:30px;font-weight:800;margin-top:5px}
.progress{height:9px;background:#e8eef5;border-radius:20px;overflow:hidden}.progress i{display:block;height:100%;background:#2563eb;border-radius:20px}
.badge{display:inline-block;padding:5px 9px;border-radius:20px;background:#eaf2ff;color:#2563eb;font-size:12px;font-weight:700}
input,select,textarea{width:100%;padding:12px 13px;border:1px solid #d8e0ea;border-radius:11px;background:#fff;outline:none}
input:focus,select:focus,textarea:focus{border-color:#60a5fa;box-shadow:0 0 0 3px #dbeafe}
label{display:block;font-size:13px;font-weight:700;margin:0 0 6px}.field{margin-bottom:14px}
.auth{min-height:100vh;display:grid;grid-template-columns:1.1fr .9fr;background:#f7fbff}
.authleft{padding:70px;display:flex;flex-direction:column;justify-content:center;background:linear-gradient(135deg,#eff6ff,#ecfdf5)}
.authleft h1{font-size:52px;max-width:600px}.authleft p{font-size:18px;line-height:1.7;max-width:600px;color:#526176}
.authright{display:flex;align-items:center;justify-content:center;padding:30px}.authcard{width:min(460px,100%);background:#fff;border:1px solid #e5ebf2;border-radius:24px;padding:30px;box-shadow:0 15px 50px rgba(30,60,100,.1)}
.tabs{display:flex;background:#f1f5f9;padding:4px;border-radius:12px;margin-bottom:20px}.tabs button{flex:1;padding:10px;border-radius:9px;background:none}.tabs button.active{background:#fff;box-shadow:0 2px 7px #dce4ee;font-weight:700}
.role{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}.role button{padding:14px;border:1px solid #dce5ef;background:#fff;border-radius:12px}.role button.active{border:2px solid #2563eb;background:#eff6ff}
.gamecard{min-height:190px;display:flex;align-items:center;justify-content:center;text-align:center}
.game-grid{display:grid;grid-template-columns:repeat(4,80px);gap:10px;justify-content:center;margin:20px 0}
.tile{width:80px;height:80px;border-radius:13px;background:#e9f1ff;display:grid;place-items:center;font-size:28px;font-weight:800;color:#2563eb}
.tile.revealed{background:#dbeafe}.tile.matched{background:#d1fae5;color:#059669}
.options{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:20px}
.option{min-width:90px;padding:15px;border:2px solid #dbe4ee;border-radius:12px;background:#fff;font-size:20px}
.option:hover{border-color:#2563eb}
.objarea{height:280px;background:#f8fafc;border-radius:15px;position:relative;overflow:hidden;margin:18px 0;border:1px solid #e4eaf1}
.object{position:absolute;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:#2563eb;color:#fff;font-size:25px;user-select:none}
.story-photo{width:100%;height:210px;object-fit:cover;border-radius:14px;background:#f1f5f9}
.album{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.album img{width:100%;height:150px;object-fit:cover;border-radius:12px}
.voice{width:58px;height:58px;border-radius:50%;background:#2563eb;color:#fff;font-size:24px;box-shadow:0 7px 20px #bfdbfe}
.voice.listening{background:#ef4444;animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
.toast{position:fixed;right:22px;bottom:22px;background:#172033;color:#fff;padding:14px 18px;border-radius:12px;z-index:100;box-shadow:0 10px 30px #0002}
.modal{position:fixed;inset:0;background:#17203399;display:grid;place-items:center;z-index:80;padding:20px}.modalbox{width:min(700px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:20px;padding:24px}
.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:12px;border-bottom:1px solid #edf1f5}
.empty{text-align:center;padding:40px;color:#718096}
@media(max-width:900px){.auth{grid-template-columns:1fr}.authleft{display:none}.side{width:70px}.nav{font-size:0;text-align:center}.main{padding:18px}.g2,.g3,.g4{grid-template-columns:1fr}}
/* SMRITI_CONNECTION_SYSTEM_V1 */

.connection-fab {
    position: fixed;
    left: 22px;
    bottom: 88px;
    z-index: 9998;
    border: 0;
    border-radius: 18px;
    padding: 13px 18px;
    background: #ffffff;
    color: #183153;
    box-shadow: 0 10px 30px rgba(0,0,0,.14);
    font-weight: 800;
    cursor: pointer;
    border: 1px solid #dce6f2;
}

.connection-fab:hover {
    transform: translateY(-2px);
}

.connection-overlay {
    position: fixed;
    inset: 0;
    z-index: 10000;
    background: rgba(20,30,45,.42);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.connection-modal {
    width: min(720px, 96vw);
    max-height: 90vh;
    overflow-y: auto;
    background: #ffffff;
    border-radius: 26px;
    padding: 28px;
    box-shadow: 0 30px 80px rgba(0,0,0,.22);
}

.connection-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 20px;
    margin-bottom: 22px;
}

.connection-id-box {
    background: #eef6ff;
    border: 1px solid #cfe3fa;
    border-radius: 18px;
    padding: 18px;
    margin: 16px 0;
}

.connection-id {
    font-size: 25px;
    font-weight: 900;
    letter-spacing: 1.5px;
    color: #165d9c;
    margin-top: 7px;
}

.connection-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    padding: 15px;
    border: 1px solid #e4e9ef;
    border-radius: 16px;
    margin-top: 10px;
    background: #fafcff;
}

.connection-status {
    display: inline-block;
    padding: 6px 10px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 800;
}

.connection-status.pending {
    background: #fff5d9;
    color: #8a6500;
}

.connection-status.connected {
    background: #e5f8ed;
    color: #16723b;
}

.connection-status.rejected {
    background: #ffe9e9;
    color: #a22a2a;
}

.connection-input {
    width: 100%;
    padding: 14px 16px;
    border-radius: 14px;
    border: 1px solid #ccd6e2;
    font-size: 17px;
    outline: none;
    box-sizing: border-box;
}

.connection-input:focus {
    border-color: #3988d4;
    box-shadow: 0 0 0 3px rgba(57,136,212,.12);
}

.connection-section {
    margin-top: 24px;
}

.connection-close {
    border: 0;
    background: #f0f3f7;
    border-radius: 12px;
    padding: 9px 13px;
    cursor: pointer;
    font-weight: 800;
}

.connection-copy {
    border: 0;
    background: #1769aa;
    color: white;
    border-radius: 12px;
    padding: 10px 15px;
    cursor: pointer;
    font-weight: 800;
}

.connection-danger {
    background: #fff0f0;
    color: #a52c2c;
}

.connection-success {
    background: #effbf4;
    border: 1px solid #c9efd8;
    color: #176b3a;
    padding: 15px;
    border-radius: 15px;
    margin-top: 15px;
}

.connection-empty {
    padding: 20px;
    text-align: center;
    background: #f8fafc;
    border-radius: 16px;
    color: #657386;
}

.low-literacy .connection-modal {
    font-size: 18px;
}

.low-literacy .connection-input {
    min-height: 58px;
    font-size: 19px;
}

.low-literacy .connection-row button {
    min-height: 50px;
    font-size: 17px;
}
</style>
</head>
<body>

<div id="root"></div>
<div id="toast" class="toast hidden"></div>
<div id="modal" class="modal hidden"></div>

<script>
'use strict';

/* =========================
   SMRITIAI CORE
========================= */

const KEY='smritiai_v3';

const LANG={
en:{
welcome:'Welcome to SmritiAI',subtitle:'Cognitive support, memory assistance and everyday routine support.',
login:'Login',signup:'Register',patient:'Patient',caregiver:'Caregiver',email:'Email / Login ID',password:'Password',
home:'Home',games:'Cognitive Games',album:'Memory Album',reminders:'Reminders',stories:'Story Mode',summary:'Session Summary',
overview:'Overview',analysis:'Patient Analysis',assignments:'Assignments',sessions:'Sessions',logout:'Logout',
start:'Start',continue:'Continue',save:'Save',cancel:'Cancel',listen:'Tell Story',stop:'Stop Listening',play:'Play Story',
music:'Game Music',level:'Level',score:'Score',accuracy:'Accuracy',back:'Back',next:'Next',
hello:'Hello',today:'Today',recent:'Recent Sessions',noData:'No data yet.',
academic:'Academic prototype — not a diagnostic or treatment system.'
},
hi:{
welcome:'SmritiAI में आपका स्वागत है',subtitle:'संज्ञानात्मक सहायता, स्मृति सहायता और दैनिक दिनचर्या सहायता।',
login:'लॉगिन',signup:'रजिस्टर',patient:'मरीज',caregiver:'केयरगिवर',email:'ईमेल / लॉगिन आईडी',password:'पासवर्ड',
home:'होम',games:'कॉग्निटिव गेम्स',album:'मेमोरी एल्बम',reminders:'रिमाइंडर',stories:'स्टोरी मोड',summary:'सेशन सारांश',
overview:'ओवरव्यू',analysis:'मरीज विश्लेषण',assignments:'असाइनमेंट',sessions:'सेशन',logout:'लॉगआउट',
start:'शुरू करें',continue:'जारी रखें',save:'सेव',cancel:'रद्द करें',listen:'कहानी बोलें',stop:'सुनना बंद करें',play:'कहानी सुनें',
music:'गेम म्यूजिक',level:'लेवल',score:'स्कोर',accuracy:'सटीकता',back:'वापस',next:'अगला',
hello:'नमस्ते',today:'आज',recent:'हाल के सेशन',noData:'अभी कोई डेटा नहीं।',
academic:'शैक्षणिक प्रोटोटाइप — यह निदान या उपचार प्रणाली नहीं है।'
},
mr:{
welcome:'SmritiAI मध्ये आपले स्वागत आहे',subtitle:'संज्ञानात्मक सहाय्य, स्मरणशक्ती सहाय्य आणि दैनंदिन दिनचर्या.',
login:'लॉगिन',signup:'नोंदणी',patient:'रुग्ण',caregiver:'केअरगिव्हर',email:'ईमेल / लॉगिन आयडी',password:'पासवर्ड',
home:'होम',games:'कॉग्निटिव्ह गेम्स',album:'मेमरी अल्बम',reminders:'स्मरणपत्रे',stories:'स्टोरी मोड',summary:'सेशन सारांश',
overview:'ओव्हरव्ह्यू',analysis:'रुग्ण विश्लेषण',assignments:'असाइनमेंट',sessions:'सेशन्स',logout:'लॉगआउट',
start:'सुरू करा',continue:'पुढे',save:'सेव्ह',cancel:'रद्द करा',listen:'कथा सांगा',stop:'ऐकणे थांबवा',play:'कथा ऐका',
music:'गेम म्युझिक',level:'लेव्हल',score:'स्कोअर',accuracy:'अचूकता',back:'मागे',next:'पुढे',
hello:'नमस्कार',today:'आज',recent:'अलीकडील सेशन्स',noData:'अजून डेटा नाही.',
academic:'शैक्षणिक प्रोटोटाइप — ही निदान किंवा उपचार प्रणाली नाही.'
}
};

let db=JSON.parse(localStorage.getItem(KEY)||'null');
if(!db){
db={
users:[
{id:'p1',role:'patient',name:'Aarav Sharma',email:'patient@smriti.ai',password:'1234',language:'en'},
{id:'c1',role:'caregiver',name:'Meera Sharma',email:'caregiver@smriti.ai',password:'1234',language:'en'}
],
sessions:[],
stories:[],
reminders:[],
assignments:[],
games:{},
active:null
};
saveDB();
}

function saveDB(){localStorage.setItem(KEY,JSON.stringify(db))}
function T(k){let l=db.active?.language||'en';return (LANG[l]&&LANG[l][k])||LANG.en[k]||k}
function toast(s){let x=document.getElementById('toast');x.textContent=s;x.classList.remove('hidden');clearTimeout(window.__toast);window.__toast=setTimeout(()=>x.classList.add('hidden'),2500)}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function user(){return db.users.find(x=>x.id===db.active?.userId)}
function patientUser(){return db.users.find(x=>x.role==='patient')}
function speak(text){
if(!('speechSynthesis' in window))return;
speechSynthesis.cancel();
let u=new SpeechSynthesisUtterance(text);
u.lang={en:'en-IN',hi:'hi-IN',mr:'mr-IN'}[db.active?.language||'en'];
u.rate=.9;
speechSynthesis.speak(u);
}

/* =========================
   AUDIO
========================= */
let audioCtx=null,musicTimer=null,musicOn=true;
function musicStart(){
if(!musicOn)return;
if(audioCtx) return;
try{
audioCtx=new (window.AudioContext||window.webkitAudioContext)();
let notes=[261.63,329.63,392,329.63],i=0;
musicTimer=setInterval(()=>{
if(!audioCtx)return;
let o=audioCtx.createOscillator(),g=audioCtx.createGain();
o.frequency.value=notes[i++%notes.length];o.type='sine';g.gain.value=.025;
o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+.25);
},650);
}catch(e){}
}
function musicStop(){if(musicTimer)clearInterval(musicTimer);musicTimer=null;if(audioCtx){audioCtx.close();audioCtx=null}}
function toggleMusic(){musicOn=!musicOn;if(!musicOn)musicStop();toast(musicOn?'Music ON':'Music OFF')}

/* =========================
   SPEECH — SINGLE INSTANCE
========================= */
let recognition=null, listening=false, storyListening=false, storyFinal='';
function setupRecognition(){
let SR=window.SpeechRecognition||window.webkitSpeechRecognition;
if(!SR)return null;
let r=new SR();
r.continuous=false;
r.interimResults=true;
r.maxAlternatives=1;
r.lang={en:'en-IN',hi:'hi-IN',mr:'mr-IN'}[db.active?.language||'en'];
return r;
}

function startStoryListening(){
if(storyListening)return;
if(!recognition)recognition=setupRecognition();
if(!recognition){toast('Speech recognition is not supported in this browser.');return}
storyListening=true;
storyFinal='';
document.getElementById('storyTranscript').value='';
recognition.onresult=e=>{
let finalText='';
let interim='';
for(let i=e.resultIndex;i<e.results.length;i++){
let txt=e.results[i][0].transcript.trim();
if(e.results[i].isFinal) finalText+=' '+txt;
else interim+=' '+txt;
}
if(finalText){
let clean=finalText.trim();
if(clean && clean!==storyFinal.trim()){
storyFinal=(storyFinal+' '+clean).trim();
document.getElementById('storyTranscript').value=storyFinal;
}
}else{
document.getElementById('storyTranscript').value=(storyFinal+' '+interim).trim();
}
};
recognition.onerror=e=>{
storyListening=false;
updateStoryButton();
if(e.error!=='no-speech')toast('Microphone: '+e.error);
};
recognition.onend=()=>{
storyListening=false;
updateStoryButton();
};
recognition.start();
updateStoryButton();
}
function stopStoryListening(){
if(!recognition)return;
try{recognition.stop()}catch(e){}
storyListening=false;
updateStoryButton();
}
function updateStoryButton(){
let b=document.getElementById('storyListenBtn');
if(b)b.textContent=storyListening?T('stop'):T('listen');
}

/* =========================
   LOGIN
========================= */
let authMode='login',authRole='patient';
function auth(){
document.getElementById('root').innerHTML=`
<div class="auth">
<div class="authleft">
<div class="logo">Smriti<span>AI</span></div>
<h1>${T('welcome')}</h1>
<p>${T('subtitle')}</p>
<div class="card" style="max-width:600px;margin-top:20px">
<b>Designed for memory support</b><p class="muted">Cognitive games • Memory assistance • Routine support • Caregiver insights • Story preservation</p>
</div>
</div>
<div class="authright">
<div class="authcard">
<div class="row between"><h2 id="authTitle">${authMode==='login'?T('login'):T('signup')}</h2>
<select id="language" style="width:125px" onchange="changeAuthLang(this.value)">
<option value="en">English</option><option value="hi">हिन्दी</option><option value="mr">मराठी</option>
</select></div>
<div class="tabs"><button class="${authMode==='login'?'active':''}" onclick="authMode='login';auth()">${T('login')}</button><button class="${authMode==='signup'?'active':''}" onclick="authMode='signup';auth()">${T('signup')}</button></div>
<div class="role"><button class="${authRole==='patient'?'active':''}" onclick="authRole='patient';auth()">👤 ${T('patient')}</button><button class="${authRole==='caregiver'?'active':''}" onclick="authRole='caregiver';auth()">👩‍⚕️ ${T('caregiver')}</button></div>
<div class="field"><label>${T('email')}</label><input id="email" placeholder="name@example.com"></div>
<div class="field"><label>${T('password')}</label><input id="password" type="password" placeholder="••••"></div>
<div id="nameField" class="${authMode==='signup'?'':'hidden'}"><div class="field"><label>Full name</label><input id="name" placeholder="Your name"></div></div>
<button class="primary" style="width:100%" onclick="submitAuth()">${authMode==='login'?T('login'):T('signup')}</button>
<div class="small muted" style="margin-top:16px">Demo: patient@smriti.ai / 1234<br>Demo: caregiver@smriti.ai / 1234</div>
</div></div></div>`;
document.getElementById('language').value=db.active?.language||'en';
}
function changeAuthLang(l){db.active=db.active||{};db.active.language=l;auth()}
function submitAuth(){
let email=document.getElementById('email').value.trim().toLowerCase();
let pass=document.getElementById('password').value;
if(!email||!pass){toast('Enter login ID and password');return}
if(authMode==='signup'){
let exists=db.users.find(x=>x.email===email);
if(exists){toast('Account already exists');return}
let u={id:uid(),role:authRole,name:document.getElementById('name').value.trim()||'SmritiAI User',email,password:pass,language:document.getElementById('language').value};
db.users.push(u);db.active={userId:u.id,language:u.language};saveDB();renderApp();return;
}
let u=db.users.find(x=>x.email===email&&x.password===pass&&x.role===authRole);
if(!u){toast('Incorrect login or role');return}
db.active={userId:u.id,language:u.language||'en'};saveDB();renderApp();
}

/* =========================
   APP SHELL
========================= */
let page='home';
function renderApp(){
if(!db.active||!user()){auth();return}
document.getElementById('root').innerHTML=`
<div class="app">
<header class="top"><div class="logo">Smriti<span>AI</span></div><div class="userbox"><select onchange="setLanguage(this.value)" style="width:115px"><option value="en">English</option><option value="hi">हिन्दी</option><option value="mr">मराठी</option></select><div class="avatar">${esc(user().name[0]||'S')}</div><b>${esc(user().name)}</b></div></header>
<div class="layout"><aside class="side" id="side"></aside><main class="main" id="main"></main></div>
</div>`;
document.querySelector('.top select').value=db.active.language||'en';
renderNav();renderPage();installConnectionSystem();
}
function setLanguage(l){db.active.language=l;let u=user();if(u)u.language=l;saveDB();renderApp()}
function navItem(id,label,icon){return `<button class="nav ${page===id?'active':''}" onclick="go('${id}')">${icon} &nbsp;${label}</button>`}
function renderNav(){
let caregiver=user().role==='caregiver';

function voiceCommand(){
let r=setupRecognition();
if(!r){toast('Speech recognition is unavailable');return}
r.continuous=false;r.interimResults=false;
r.onresult=e=>{
let text=e.results[0][0].transcript.toLowerCase();
speak('I heard '+text);
if(text.includes('game'))go('games');
else if(text.includes('story'))go('stories');
else if(text.includes('album')||text.includes('memory'))go('album');
else if(text.includes('reminder'))go('reminders');
else if(text.includes('summary'))go('summary');
else toast('Try: open games, stories, album or reminders');
};
r.onerror=()=>toast('I could not hear that. Try again.');
try{r.start()}catch(e){}
}

const GAME_NAMES=[
['memory','Memory Match','Match the hidden pairs.'],
['pattern','Pattern Sequence','Remember the sequence.'],
['find','Find the Object','Find the requested object.'],
['color','Pattern Match','Choose the matching pattern.'],
['number','Number Memory','Remember the number.'],
['odd','Find the Difference','Find the different symbol.']
];
function gamesHome(){
document.getElementById('main').innerHTML=`
<div class="row between"><div><h1>${T('games')}</h1><p class="muted">Continuous adaptive cognitive activities. There is no level limit.</p></div><button class="secondary" onclick="toggleMusic()">🎵 ${T('music')}</button></div>
<div class="grid g3" style="margin-top:20px">${GAME_NAMES.map((g,i)=>`<div class="card"><div style="font-size:35px">${['🧩','🔢','🔎','🎨','🧠','🔷'][i]}</div><h2>${g[1]}</h2><p class="muted">${g[2]}</p><button class="primary" onclick="startGame('${g[0]}')">${T('start')}</button></div>`).join('')}</div>`;
}
let gameState=null;
function startGame(type){
musicStart();
let key=user().id+'_'+type;
let saved=db.games[key]||{level:1,total:0,correct:0};
gameState={type,level:saved.level,total:saved.total,correct:saved.correct,streak:0,started:Date.now(),data:null};
renderGame();
}
function renderGame(){
let g=GAME_NAMES.find(x=>x[0]===gameState.type);
document.getElementById('main').innerHTML=`
<div class="row between"><div><button class="secondary" onclick="endGame()">← ${T('back')}</button></div><div><span class="badge">${g[1]}</span> <span class="badge">${T('level')} ${gameState.level}</span> <span class="badge">${T('score')} ${gameState.correct}</span></div></div>
<div class="card" style="margin-top:18px"><div class="row between"><div><h1>${g[1]}</h1><p class="muted">Level ${gameState.level} • Continuous mode</p></div><button class="secondary" onclick="toggleMusic()">🎵</button></div><div id="gameArea"></div></div>`;
nextRound();
}
function nextRound(){
let a=document.getElementById('gameArea');if(!a)return;
let t=gameState.type;
if(t==='memory')memoryRound(a);
if(t==='pattern')patternRound(a);
if(t==='find')findRound(a);
if(t==='color')colorRound(a);
if(t==='number')numberRound(a);
if(t==='odd')oddRound(a);
}
function record(correct){
gameState.total++;
if(correct){gameState.correct++;gameState.streak++}else gameState.streak=0;
let acc=Math.round(gameState.correct/gameState.total*100);
let key=user().id+'_'+gameState.type;
db.games[key]={level:gameState.level,total:gameState.total,correct:gameState.correct,accuracy:acc};
saveDB();
setTimeout(()=>{gameState.level++;nextRound()},450);
}
function memoryRound(a){
let n=gameState.level<4?3:4;
let vals=[...Array(n)].map((_,i)=>i+1);let cards=[...vals,...vals].sort(()=>Math.random()-.5);
a.innerHTML=`<p class="muted">Find all matching pairs.</p><div class="game-grid" id="mg"></div>`;
let grid=document.getElementById('mg'),open=[],matched=0;
cards.forEach((v,i)=>{let b=document.createElement('button');b.className='tile';b.textContent='?';b.onclick=()=>{
if(open.length>=2||b.classList.contains('matched')||open.some(x=>x.i===i))return;
b.textContent=v;b.classList.add('revealed');open.push({i,v,b});
if(open.length===2){
if(open[0].v===open[1].v){open.forEach(x=>x.b.classList.add('matched'));matched+=2;open=[];if(matched===cards.length){record(true)}}else{let q=[...open];open=[];setTimeout(()=>q.forEach(x=>{x.b.textContent='?';x.b.classList.remove('revealed')}),550)}
}};grid.appendChild(b)});
}
function patternRound(a){
let len=Math.min(3+Math.floor(gameState.level/3),8),seq=[...Array(len)].map(()=>Math.floor(Math.random()*4)+1);
a.innerHTML=`<p class="muted">Watch the pattern.</p><div id="show" style="font-size:40px;text-align:center;margin:30px">${seq.join(' • ')}</div><div class="options">${[...Array(4)].map((_,i)=>`<button class="option" onclick="patternAnswer(${i+1},${seq[len-1]})">${i+1}</button>`).join('')}</div>`;
setTimeout(()=>{let x=document.getElementById('show');if(x)x.textContent='? • ? • ? • ?'},1200);
}
function patternAnswer(x,correct){record(x===correct)}
function findRound(a){
let symbols=['🍎','⭐','🔵','🟩','❤️','🔺','🌙','☀️'],target=symbols[Math.floor(Math.random()*symbols.length)];
let count=12,items=[...Array(count)].map(()=>symbols[Math.floor(Math.random()*symbols.length)]);let pos=Math.floor(Math.random()*count);items[pos]=target;
a.innerHTML=`<p class="muted">Find: <b style="font-size:25px">${target}</b></p><div class="options">${items.map((x,i)=>`<button class="option" onclick="findAnswer('${esc(x)}','${esc(target)}')">${x}</button>`).join('')}</div>`;
window.findAnswer=(x,t)=>record(x===t);
}
function colorRound(a){
let target=Math.floor(Math.random()*4),colors=['🔴','🔵','🟢','🟡'];
a.innerHTML=`<p class="muted">Which symbol matches the target?</p><div style="font-size:60px;text-align:center">${colors[target]}</div><div class="options">${colors.map((x,i)=>`<button class="option" onclick="record(${i===target})">${x}</button>`).join('')}</div>`;
}
function numberRound(a){
let len=Math.min(3+Math.floor(gameState.level/2),10),n=Math.floor(Math.random()*Math.pow(10,len)).toString().padStart(len,'0');
a.innerHTML=`<div style="text-align:center"><p class="muted">Remember this number.</p><div style="font-size:42px;font-weight:800" id="num">${n}</div><div id="numInput" class="hidden"><input id="answer" placeholder="Type the number" style="max-width:250px"><button class="primary" onclick="record(document.getElementById('answer').value=== '${n}')">Check</button></div></div>`;
setTimeout(()=>{document.getElementById('num').textContent='••••';document.getElementById('numInput').classList.remove('hidden')},1300);
}
function oddRound(a){
let base=['🔵','🔵','🔵','🔵','🟢','🔵','🔵','🔵'];let pos=Math.floor(Math.random()*base.length);
a.innerHTML=`<p class="muted">Find the different symbol.</p><div class="options">${base.map((x,i)=>`<button class="option" onclick="record(${i===pos})">${x}</button>`).join('')}</div>`;
}
function endGame(){
musicStop();
let acc=gameState.total?Math.round(gameState.correct/gameState.total*100):0;
db.sessions.push({id:uid(),patientId:user().id,date:new Date().toISOString(),game:GAME_NAMES.find(x=>x[0]===gameState.type)[1],level:gameState.level,accuracy:acc,correct:gameState.correct,total:gameState.total,duration:Math.round((Date.now()-gameState.started)/1000)});
saveDB();gameState=null;go('summary');
}

/* ============================================================
   SMRITI_CONNECTION_SYSTEM_V1
   Patient <-> Caregiver connection by unique ID
   ============================================================ */

function ensureConnectionDB() {
    if (!db.connections) {
        db.connections = [];
    }

    /*
      Give every existing account a permanent demo-safe ID.
      New accounts can also receive an ID automatically.
    */
    db.users.forEach(function(u) {
        if (!u.connectionId) {
            if (u.role === 'caregiver') {
                u.connectionId = makeConnectionId('CG');
            } else {
                u.connectionId = makeConnectionId('PT');
            }
        }
    });

    saveDB();
}

function makeConnectionId(roleCode) {
    var chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    var value = '';

    for (var i = 0; i < 4; i++) {
        value += chars[Math.floor(Math.random() * chars.length)];
    }

    var id = 'SMR-' + roleCode + '-' + value;

    if (db.users.some(function(u) {
        return u.connectionId === id;
    })) {
        return makeConnectionId(roleCode);
    }

    return id;
}

function currentConnection() {
    ensureConnectionDB();

    var u = user();
    if (!u) return null;

    return db.connections.find(function(c) {
        return c.patientId === u.id || c.caregiverId === u.id;
    }) || null;
}

function patientConnections() {
    ensureConnectionDB();

    var p = user();
    if (!p) return [];

    return db.connections.filter(function(c) {
        return c.patientId === p.id;
    });
}

function caregiverConnections() {
    ensureConnectionDB();

    var c = user();
    if (!c) return [];

    return db.connections.filter(function(x) {
        return x.caregiverId === c.id;
    });
}

function getConnectedCaregiver() {
    ensureConnectionDB();

    var p = user();
    if (!p || p.role !== 'patient') return null;

    var connection = db.connections.find(function(c) {
        return c.patientId === p.id && c.status === 'connected';
    });

    if (!connection) return null;

    return db.users.find(function(u) {
        return u.id === connection.caregiverId;
    }) || null;
}

function getConnectedPatients() {
    ensureConnectionDB();

    var c = user();
    if (!c || c.role !== 'caregiver') return [];

    var ids = db.connections
        .filter(function(x) {
            return x.caregiverId === c.id && x.status === 'connected';
        })
        .map(function(x) {
            return x.patientId;
        });

    return db.users.filter(function(u) {
        return ids.indexOf(u.id) !== -1;
    });
}

function findUserByConnectionId(id) {
    ensureConnectionDB();

    var clean = String(id || '').trim().toUpperCase();

    return db.users.find(function(u) {
        return String(u.connectionId || '').toUpperCase() === clean;
    }) || null;
}

function connectPatientToCaregiver() {
    ensureConnectionDB();

    var p = user();

    if (!p || p.role !== 'patient') {
        toast('Only a patient account can send a caregiver request.');
        return;
    }

    var input = document.getElementById('caregiverConnectionId');

    if (!input) return;

    var caregiverId = input.value.trim().toUpperCase();

    if (!caregiverId) {
        toast('Please enter the caregiver ID.');
        return;
    }

    var caregiver = findUserByConnectionId(caregiverId);

    if (!caregiver || caregiver.role !== 'caregiver') {
        toast('Caregiver ID not found.');
        return;
    }

    if (caregiver.id === p.id) {
        toast('You cannot connect to yourself.');
        return;
    }

    var existing = db.connections.find(function(c) {
        return c.patientId === p.id &&
               c.caregiverId === caregiver.id &&
               c.status !== 'rejected';
    });

    if (existing) {
        if (existing.status === 'connected') {
            toast('You are already connected to this caregiver.');
        } else {
            toast('A connection request is already pending.');
        }
        return;
    }

    db.connections.push({
        id: uid(),
        patientId: p.id,
        caregiverId: caregiver.id,
        status: 'pending',
        createdAt: new Date().toISOString(),
        updatedAt: new Date().toISOString()
    });

    saveDB();

    toast('Connection request sent to ' + caregiver.name + '.');

    openConnectionPanel();
}

function acceptConnection(connectionId) {
    ensureConnectionDB();

    var c = db.connections.find(function(x) {
        return x.id === connectionId;
    });

    if (!c) return;

    if (!user() || user().role !== 'caregiver') return;

    /*
      One patient can have one active caregiver in this prototype.
      If an existing active connection exists, keep it.
    */
    var existing = db.connections.find(function(x) {
        return x.patientId === c.patientId &&
               x.status === 'connected' &&
               x.id !== c.id;
    });

    if (existing) {
        toast('This patient is already connected to another caregiver.');
        return;
    }

    c.status = 'connected';
    c.updatedAt = new Date().toISOString();

    saveDB();

    toast('Patient connected successfully.');

    openConnectionPanel();
}

function rejectConnection(connectionId) {
    ensureConnectionDB();

    var c = db.connections.find(function(x) {
        return x.id === connectionId;
    });

    if (!c) return;

    if (!user() || user().role !== 'caregiver') return;

    c.status = 'rejected';
    c.updatedAt = new Date().toISOString();

    saveDB();

    toast('Connection request rejected.');

    openConnectionPanel();
}

function disconnectConnection(connectionId) {
    ensureConnectionDB();

    var c = db.connections.find(function(x) {
        return x.id === connectionId;
    });

    if (!c) return;

    if (!user()) return;

    if (c.patientId !== user().id && c.caregiverId !== user().id) {
        return;
    }

    c.status = 'rejected';
    c.updatedAt = new Date().toISOString();

    saveDB();

    toast('Connection removed.');

    openConnectionPanel();
}

function copyConnectionId() {
    var u = user();

    if (!u || !u.connectionId) return;

    if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(u.connectionId)
            .then(function() {
                toast('ID copied.');
            })
            .catch(function() {
                toast('Your ID is ' + u.connectionId);
            });
    } else {
        toast('Your ID is ' + u.connectionId);
    }
}

function connectionStatusText(status) {
    if (status === 'connected') return 'CONNECTED';
    if (status === 'pending') return 'PENDING';
    if (status === 'rejected') return 'REJECTED';
    return String(status || '').toUpperCase();
}

function connectionPatientName(connection) {
    var p = db.users.find(function(u) {
        return u.id === connection.patientId;
    });

    return p ? p.name : 'Unknown patient';
}

function connectionCaregiverName(connection) {
    var c = db.users.find(function(u) {
        return u.id === connection.caregiverId;
    });

    return c ? c.name : 'Unknown caregiver';
}

function connectionPanelHTML() {
    ensureConnectionDB();

    var u = user();

    if (!u) return '';

    var html = '';

    html += '<div class="connection-overlay" id="connectionOverlay" onclick="closeConnectionPanel(event)">';
    html += '<div class="connection-modal" onclick="event.stopPropagation()">';

    html += '<div class="connection-header">';
    html += '<div>';
    html += '<div style="font-size:28px;font-weight:900;">🔗 Care Connection</div>';
    html += '<div style="margin-top:6px;color:#687789;">Patient and caregiver connection</div>';
    html += '</div>';
    html += '<button class="connection-close" onclick="closeConnectionPanel()">✕</button>';
    html += '</div>';

    html += '<div class="connection-id-box">';
    html += '<div style="font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.7px;">Your SmritiAI ID</div>';
    html += '<div class="connection-id">' + esc(u.connectionId) + '</div>';
    html += '<div style="margin-top:8px;color:#5e7085;">Share this ID only with the person you want to connect with.</div>';
    html += '<button class="connection-copy" style="margin-top:12px;" onclick="copyConnectionId()">📋 Copy ID</button>';
    html += '</div>';

    if (u.role === 'patient') {

        var connectedCaregiver = getConnectedCaregiver();

        if (connectedCaregiver) {
            html += '<div class="connection-success">';
            html += '<strong>✓ Connected Caregiver</strong><br>';
            html += esc(connectedCaregiver.name);
            html += '<br><small>' + esc(connectedCaregiver.connectionId) + '</small>';
            html += '</div>';

            var connection = db.connections.find(function(c) {
                return c.patientId === u.id &&
                       c.caregiverId === connectedCaregiver.id &&
                       c.status === 'connected';
            });

            if (connection) {
                html += '<button class="connection-close connection-danger" style="margin-top:12px;" onclick="disconnectConnection(\'' + connection.id + '\')">Disconnect Caregiver</button>';
            }

        } else {

            html += '<div class="connection-section">';
            html += '<h3>Connect to your caregiver</h3>';
            html += '<p style="color:#687789;">Enter the unique Caregiver ID provided by your caregiver.</p>';
            html += '<input id="caregiverConnectionId" class="connection-input" placeholder="Example: SMR-CG-AB27" autocomplete="off">';
            html += '<button class="primary" style="margin-top:12px;width:100%;" onclick="connectPatientToCaregiver()">🔗 Send Connection Request</button>';
            html += '</div>';

            var pending = db.connections.filter(function(c) {
                return c.patientId === u.id && c.status === 'pending';
            });

            if (pending.length) {
                html += '<div class="connection-section">';
                html += '<h3>Pending Requests</h3>';

                pending.forEach(function(c) {
                    html += '<div class="connection-row">';
                    html += '<div><strong>' + esc(connectionCaregiverName(c)) + '</strong><br>';
                    html += '<small>Request sent</small></div>';
                    html += '<span class="connection-status pending">PENDING</span>';
                    html += '</div>';
                });

                html += '</div>';
            }
        }

    } else {

        var pendingRequests = db.connections.filter(function(c) {
            return c.caregiverId === u.id && c.status === 'pending';
        });

        html += '<div class="connection-section">';
        html += '<h3>Patient Requests</h3>';

        if (!pendingRequests.length) {
            html += '<div class="connection-empty">No pending patient connection requests.</div>';
        } else {

            pendingRequests.forEach(function(c) {

                var p = db.users.find(function(x) {
                    return x.id === c.patientId;
                });

                html += '<div class="connection-row">';
                html += '<div>';
                html += '<strong>' + esc(p ? p.name : 'Unknown patient') + '</strong><br>';
                html += '<small>' + esc(p ? p.connectionId : '') + '</small>';
                html += '</div>';

                html += '<div style="display:flex;gap:8px;flex-wrap:wrap;">';
                html += '<button class="primary" onclick="acceptConnection(\'' + c.id + '\')">✓ Accept</button>';
                html += '<button class="connection-close connection-danger" onclick="rejectConnection(\'' + c.id + '\')">Reject</button>';
                html += '</div>';

                html += '</div>';
            });
        }

        html += '</div>';

        var patients = getConnectedPatients();

        html += '<div class="connection-section">';
        html += '<h3>Connected Patients</h3>';

        if (!patients.length) {
            html += '<div class="connection-empty">No connected patients yet.</div>';
        } else {

            patients.forEach(function(p) {

                var con = db.connections.find(function(c) {
                    return c.patientId === p.id &&
                           c.caregiverId === u.id &&
                           c.status === 'connected';
                });

                html += '<div class="connection-row">';
                html += '<div>';
                html += '<strong>👤 ' + esc(p.name) + '</strong><br>';
                html += '<small>Patient ID: ' + esc(p.connectionId) + '</small>';
                html += '</div>';

                html += '<div style="display:flex;align-items:center;gap:10px;">';
                html += '<span class="connection-status connected">CONNECTED</span>';

                if (con) {
                    html += '<button class="connection-close connection-danger" onclick="disconnectConnection(\'' + con.id + '\')">Disconnect</button>';
                }

                html += '</div>';
                html += '</div>';
            });
        }

        html += '</div>';
    }

    html += '</div>';
    html += '</div>';

    return html;
}

function openConnectionPanel() {
    ensureConnectionDB();

    var old = document.getElementById('connectionOverlay');

    if (old) old.remove();

    document.body.insertAdjacentHTML('beforeend', connectionPanelHTML());
}

function closeConnectionPanel(event) {
    if (event && event.target && event.target.id !== 'connectionOverlay') {
        return;
    }

    var el = document.getElementById('connectionOverlay');

    if (el) el.remove();
}

function installConnectionButton() {
    ensureConnectionDB();

    var old = document.getElementById('connectionFab');

    if (old) old.remove();

    var u = user();

    if (!u) return;

    var button = document.createElement('button');

    button.id = 'connectionFab';
    button.className = 'connection-fab';
    button.onclick = openConnectionPanel;

    if (u.role === 'patient') {
        var cg = getConnectedCaregiver();

        button.innerHTML = cg
            ? '🔗 Caregiver Connected'
            : '🔗 Connect Caregiver';
    } else {
        var requests = db.connections.filter(function(c) {
            return c.caregiverId === u.id && c.status === 'pending';
        }).length;

        button.innerHTML = requests
            ? '🔗 Care Requests (' + requests + ')'
            : '🔗 Patient Connections';
    }

    document.body.appendChild(button);
}

/*
   Run this after the normal application render.
   It does not replace the existing application.
*/
function installConnectionSystem() {
    try {
        ensureConnectionDB();
        installConnectionButton();
    } catch (e) {
        console.error('Connection system error:', e);
    }
}

ensureConnectionDB();

/* =========================
   START
========================= */
if(db.active&&db.users.some(x=>x.id===db.active.userId))renderApp();else auth();
</script>

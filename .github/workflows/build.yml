name: Build SmritiAI APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          rm -rf smritiai_build
          mkdir smritiai_build
          unzip -q SmritiAI_Source.zip -d smritiai_build
          echo "Checking project..."
          test -f smritiai_build/pubspec.yaml
          test -d smritiai_build/lib
          test -d smritiai_build/android

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Build APK
        working-directory: smritiai_build
        run: |
          flutter pub get
          flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SmritiAI-APK
          path: smritiai_build/build/app/outputs/flutter-apk/app-debug.apk
          
